# Synthetic example: replace devices, IPs and MACs for a dedicated Linux lab.
version 1
default deny
limits 1024 30000
port lan eth0 10.77.0.126/25 02:00:00:00:00:01
port wan eth1 10.77.0.254/25 02:00:00:00:00:02
route 10.77.0.0/25 lan direct
route 10.77.0.128/25 wan direct
neighbor lan 10.77.0.2 02:00:00:00:00:0a
neighbor wan 10.77.0.130 02:00:00:00:00:0b
neighbor wan 10.77.0.131 02:00:00:00:00:0c
# Rules match ORIGINAL ingress tuples, before service/SNAT translation.
acl allow lan udp 10.77.0.0/25 0.0.0.0/0 * 9000
acl allow lan icmp 10.77.0.0/25 0.0.0.0/0 * *
acl allow wan icmp 10.77.0.128/25 0.0.0.0/0 * *
snat wan 10.77.0.254 40000 40003
# UDP service. Round robin selects per new flow; established flows remain pinned.
service lan 10.77.0.100 9000 10.77.0.130:9000 10.77.0.131:9000
