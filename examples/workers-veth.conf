# Private two-port UDP/SNAT acceptance only.
version 1
default deny
limits 32 30000
flow-index on
tcp-stateful on
tcp-timeouts 10000 120000 30000
port lan nf-in 10.88.0.1/24 02:88:00:00:00:02
port wan nf-out 10.89.0.1/24 02:89:00:00:00:01
route 10.89.0.2/32 wan direct
route 10.88.0.2/32 lan direct
neighbor wan 10.89.0.2 02:89:00:00:00:02
neighbor lan 10.88.0.2 02:88:00:00:00:01
acl allow lan udp 10.88.0.0/24 10.89.0.0/24 * 9000
acl allow lan tcp 10.88.0.0/24 0.0.0.0/0 * 9000
snat wan 10.89.0.1 40000 40031
tcp-service lan 10.88.0.100 9000 10.89.0.2:9000
